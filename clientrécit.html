<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    
    <!-- EN-TÊTES DE SÉCURITÉ -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:;">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partagez votre expérience - Votre Agence</title>
    <meta name="description" content="Proposez votre propre récit de voyage et partagez votre 'journée à...' avec la communauté de Vos Rêves.">
    
    <!-- Liens CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body class="form-page-body">
    <!-- ... votre animation de fond ... -->
    <div class="animation-background"> ... </div>

    <div class="main-content-wrapper">
        <a href="https://candicevialette.github.io/vosreves/index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Retour
        </a>
        <div class="submission-container">
            <div class="submission-header">
                <h1>Partagez votre expérience</h1>
                <p class="page-intro">Racontez-nous votre histoire. Les plus beaux récits seront publiés sur notre site !</p>
            </div>

            <form id="experience-form">
                <div class="form-group">
                    <label for="prenom">Votre prénom :</label>
                    <input type="text" id="prenom" name="prenom" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="initiale_nom">Première lettre de votre nom de famille :</label>
                    <input type="text" id="initiale_nom" name="initiale_nom" required maxlength="1" pattern="[A-Za-z]">
                </div>
                <div class="form-group">
                    <label for="email">Votre adresse mail :</label>
                    <input type="email" id="email" name="email" placeholder="exemple@domaine.com" required maxlength="250">
                    <p class="form-hint">
                        Nous utiliserons cet e-mail uniquement si votre récit est sélectionné.
                    </p>
                </div>
                <div class="form-group">
                    <label for="destination">Quelle était votre destination ?</label>
                    <input type="text" id="destination" name="destination" placeholder="Le lieu de votre expérience" required maxlength="150">
                </div>
                <div class="form-group">
                    <label for="recit">Le récit de votre journée :</label>
                    <textarea id="recit" name="recit" rows="10" placeholder="Décrivez votre journée, les lieux visités, vos émotions..." required maxlength="5000"></textarea>
                </div>

                <!-- SÉCURITÉ : Champ "pot de miel" invisible pour les robots -->
                <div class="honeypot-field" style="position: absolute; left: -5000px;" aria-hidden="true">
                    <label for="website">Ne pas remplir ce champ</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn-primary submit-experience">Envoyer mon expérience</button>
                </div>
                <p id="form-status"></p>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('experience-form');
        const statusMessage = document.getElementById('form-status');
        const submitButton = document.getElementById('submit-btn');
        const googleAppScriptUrl = 'VOTRE_URL_DE_SCRIPT_GOOGLE_ICI';

        // NOUVEAU : Fonction pour détecter les caractères de code
        function containsHtml(str) {
            return /[<>]/g.test(str);
        }

        // NOUVEAU : Vérification en temps réel des champs de texte
        const fieldsToSanitize = [document.getElementById('prenom'), document.getElementById('destination'), document.getElementById('recit')];
        fieldsToSanitize.forEach(field => {
            field.addEventListener('input', () => {
                if (containsHtml(field.value)) {
                    statusMessage.textContent = 'Attention : Les caractères < et > ne sont pas autorisés.';
                    statusMessage.className = 'status-error';
                    submitButton.disabled = true;
                } else {
                    statusMessage.textContent = '';
                    statusMessage.className = '';
                    submitButton.disabled = false;
                }
            });
        });

        form.addEventListener('submit', event => {
            event.preventDefault();
            
            // Vérification finale avant envoi
            let hasInvalidChars = false;
            fieldsToSanitize.forEach(field => {
                if (containsHtml(field.value)) {
                    hasInvalidChars = true;
                }
            });

            if (hasInvalidChars) {
                statusMessage.textContent = 'Veuillez retirer les caractères < et > de vos textes.';
                statusMessage.className = 'status-error';
                return; // Bloque l'envoi
            }

            statusMessage.textContent = 'Envoi en cours...';
            statusMessage.className = 'status-sending';
            submitButton.disabled = true;

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.date_soumission = new Date().toISOString();
            data.etat = "Nouveau";

            fetch(googleAppScriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                statusMessage.textContent = 'Merci ! Votre expérience a bien été envoyée.';
                statusMessage.className = 'status-success';
                form.reset();
            })
            .catch(error => {
                statusMessage.textContent = 'Erreur lors de l\'envoi. Veuillez réessayer plus tard.';
                statusMessage.className = 'status-error';
            })
            .finally(() => {
                submitButton.disabled = false;
            });
        });
    </script>
</body>
</html>
