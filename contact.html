<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <!-- EN-TÊTES DE SÉCURITÉ -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:;">

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Demande d'information - Votre Agence</title>
    <meta name="description" content="Contactez-nous pour organiser votre voyage sur mesure.">
    
    <!-- Liens CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body class="form-page-body">
    <!-- ... votre animation de fond ... -->
    <div class="animation-background"> ... </div>

    <div class="main-content-wrapper">
        <a href="https://candicevialette.github.io/vosreves/index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Retour
        </a>
        <div class="submission-container">
            <div class="submission-header">
                <h1>Réservez dès maintenant votre séjour</h1>
                <p class="page-intro">Échangez avec notre agence la plus proche pour réserver votre séjour idyllique.</p>
            </div>

            <form id="info-form" class="submission-form">
                <div class="form-group">
                    <label for="nom">Votre nom :</label>
                    <input type="text" id="nom" name="nom" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="prenom">Votre prénom :</label> <!-- J'ai corrigé l'id et le name pour être plus standard -->
                    <input type="text" id="prenom" name="Prénom" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="email">Votre adresse mail :</label>
                    <input type="email" id="email" name="email" placeholder="exemple@domaine.com" required maxlength="250">
                </div>
                <div class="form-group">
                    <label for="projet">Descriptif de votre projet (*) :</label>
                    <textarea id="projet" name="projet" rows="8" placeholder="Ex: Voyage en famille, lune de miel..." required maxlength="5000"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="date_depart">Date de départ approximative :</label>
                        <input type="date" id="date_depart" name="date_depart">
                    </div>
                    <div class="form-group">
                        <label for="duree">Durée envisagée en jours :</label>
                        <input type="number" id="duree" name="duree" min="1" max="365">
                    </div>
                </div>

                <!-- ... vos fieldsets ... -->

                <!-- SÉCURITÉ : Champ "pot de miel" invisible pour les robots -->
                <div class="honeypot-field" style="position: absolute; left: -5000px;" aria-hidden="true">
                    <label for="website">Ne pas remplir ce champ</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn-primary">Soumettre</button>
                </div>
                <p id="form-status"></p>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('info-form');
        const statusMessage = document.getElementById('form-status');
        const submitButton = document.getElementById('submit-btn');
        const googleAppScriptUrl = 'https://script.google.com/macros/s/AKfycby3em_z_lPlykqCff8h276QFUCIpPaZL57Keyst13v3D92GlnLZMo997morhKLYbbN4ZA/exec';

        // NOUVEAU : Fonction pour détecter les caractères de code
        function containsHtml(str) {
            return /[<>]/g.test(str);
        }

        // NOUVEAU : Vérification en temps réel
        const fieldsToSanitize = [document.getElementById('nom'), document.getElementById('prenom'), document.getElementById('projet')];
        fieldsToSanitize.forEach(field => {
            field.addEventListener('input', () => {
                if (containsHtml(field.value)) {
                    statusMessage.textContent = 'Attention : Les caractères < et > ne sont pas autorisés.';
                    statusMessage.className = 'status-error';
                    submitButton.disabled = true;
                } else {
                    statusMessage.textContent = '';
                    statusMessage.className = '';
                    submitButton.disabled = false;
                }
            });
        });

        form.addEventListener('submit', event => {
            event.preventDefault();
            
            // Vérification finale avant envoi
            if (fieldsToSanitize.some(field => containsHtml(field.value))) {
                statusMessage.textContent = 'Veuillez retirer les caractères < et > de vos textes.';
                statusMessage.className = 'status-error';
                return; // Bloque l'envoi
            }

            statusMessage.textContent = 'Envoi en cours...';
            statusMessage.style.color = '#333';
            submitButton.disabled = true;

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.infos = formData.getAll('infos');
            data.date_creation = new Date().toISOString();
            data.etat = "Nouveau";

            fetch(googleAppScriptUrl, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                statusMessage.textContent = 'Merci ! Votre demande a bien été envoyée.';
                statusMessage.style.color = 'green';
                form.reset();
            })
            .catch(error => {
                statusMessage.textContent = 'Erreur lors de l\'envoi. Veuillez réessayer plus tard.';
                statusMessage.style.color = 'red';
            })
            .finally(() => {
                submitButton.disabled = false;
            });
        });
    </script>
</body>
</html>
